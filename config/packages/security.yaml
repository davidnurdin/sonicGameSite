security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        # UserRepository::loadUserByIdentifier (the name in any case)
        app_user_provider:
            entity:
                class: App\Entity\User

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build|css)/
            security: false
        # the studio for AIs (MCP server, REST): a player's API key, no session
        api:
            pattern: ^/(mcp|api/v1)(/|$)
            stateless: true
            provider: app_user_provider
            custom_authenticators:
                - App\Security\ApiKeyAuthenticator
            entry_point: App\Security\ApiKeyAuthenticator
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: login
                check_path: login
                default_target_path: home
                enable_csrf: true
            # 5 wrong passwords a minute per name and address
            login_throttling:
                max_attempts: 5
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 2592000   # 30 days
                always_remember_me: true
            logout:
                path: logout
                target: home

    access_control:
        - { path: ^/(mcp|api/v1)(/|$), roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
